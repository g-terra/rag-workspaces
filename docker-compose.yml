# rag-workspaces: the whole stack. Start with `pnpm env:init` (once), then `docker compose up -d`.
# LM Studio runs on the host and is reached at host.docker.internal:1234.
# Published ports are bound to 127.0.0.1; Postgres and Chroma are not published at all.
# The proxy gives the stack local names: rag.localhost (admin UI), api., auth. and langflow.rag.localhost.
name: rag-workspaces

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 60
  start_period: 10s

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm env:init}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      <<: *healthcheck
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: 'FALSE'
    volumes:
      - chroma-data:/data
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3

  langflow:
    image: langflowai/langflow:1.13.3
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      chroma: { condition: service_healthy }
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:${LANGFLOW_PORT:-7860}:7860']
    environment:
      LANGFLOW_DATABASE_URL: postgresql://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/langflow
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY:?run pnpm env:init}
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD:?run pnpm env:init}
      # Auto-login off: the editor needs the superuser password, and the run API needs a key.
      LANGFLOW_AUTO_LOGIN: 'false'
      LANGFLOW_SKIP_AUTH_AUTO_LOGIN: 'false'
      LANGFLOW_NEW_USER_IS_ACTIVE: 'false'
      # Our custom components (Chroma over REST, loader, embeddings, chat model) and flows.
      LANGFLOW_COMPONENTS_PATH: /app/custom_components
      # Imported on every start and updated in place by fixed flow id (POC finding F4).
      LANGFLOW_LOAD_FLOWS_PATH: /app/flows
      # Langflow 1.13 blocks model URLs on private networks; LM Studio on the host is one (F3).
      LANGFLOW_SSRF_ALLOWED_HOSTS: host.docker.internal
      # Never put OPENAI_API_KEY here: Langflow refuses to send env keys to non-OpenAI hosts (F3).
      DO_NOT_TRACK: 'true'
    volumes:
      - langflow-data:/app/langflow
      - ./langflow/components:/app/custom_components:ro
      - ./flows:/app/flows:ro
      - uploads:/data/uploads:ro
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health_check', timeout=4)

  keycloak:
    image: keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ['start', '--import-realm']
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1:${KEYCLOAK_PORT:-8081}:8080']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-rag}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Tokens always carry the browser-facing URL as issuer. The API fetches keys from
      # http://keycloak:8080 inside the network but checks the issuer against this URL.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://auth.rag.localhost}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      # Keycloak's own admin console account (master realm). Used to create people.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run pnpm env:init}
      # Placeholders in realm.json, filled in on import (first start only).
      RW_ADMIN_USERNAME: ${RW_ADMIN_USERNAME:-admin}
      RW_ADMIN_EMAIL: ${RW_ADMIN_EMAIL:-admin@example.com}
      RW_ADMIN_PASSWORD: ${RW_ADMIN_PASSWORD:?run pnpm env:init}
      RW_ADMIN_UI_URL: ${ADMIN_UI_URL:-http://rag.localhost}
      # The admin UI's own port keeps working for sign-in too.
      RW_ADMIN_UI_FALLBACK_URL: http://localhost:${WEB_PORT:-8080}
      # Secret of the api-directory client the API lists people with (GET /v1/users).
      RW_API_DIRECTORY_SECRET: ${KEYCLOAK_DIRECTORY_SECRET:?run pnpm env:init}
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      <<: *healthcheck
      start_period: 60s
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q '"UP"' <&3

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      chroma: { condition: service_healthy }
      langflow: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['127.0.0.1:${API_PORT:-3000}:3000']
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://api.rag.localhost}
      DATABASE_URL: postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rag}
      LANGFLOW_URL: http://langflow:7860
      # The API signs in with these on start and mints its own Langflow key (decision 17).
      LANGFLOW_SUPERUSER: ${LANGFLOW_SUPERUSER:-admin}
      LANGFLOW_SUPERUSER_PASSWORD: ${LANGFLOW_SUPERUSER_PASSWORD}
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-}
      CHROMA_URL: http://chroma:8000
      # Pinned into each new workspace; changing them later affects only new workspaces.
      DEFAULT_EMBEDDING_PROVIDER: ${DEFAULT_EMBEDDING_PROVIDER:-lmstudio}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: rag-workspaces
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://auth.rag.localhost}
      KEYCLOAK_DIRECTORY_SECRET: ${KEYCLOAK_DIRECTORY_SECRET}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      DEFAULT_MIN_SCORE: ${DEFAULT_MIN_SCORE:-0.3}
      DEFAULT_CHAT_PROVIDER: ${DEFAULT_CHAT_PROVIDER:-lmstudio}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-qwen2.5-7b-instruct}
      # Earlier turns of a conversation sent to the model with each new message.
      CHAT_HISTORY_TURNS: ${CHAT_HISTORY_TURNS:-10}
      # Per person or API key, per minute: all /v1 requests, and those that run a model. 0 is off.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      RATE_LIMIT_MODEL_PER_MINUTE: ${RATE_LIMIT_MODEL_PER_MINUTE:-30}
      USAGE_QUESTION_RETENTION_DAYS: ${USAGE_QUESTION_RETENTION_DAYS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"

  web:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
      # Same value the API checks token issuers against, so the UI signs in at the same Keycloak.
      args:
        KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://auth.rag.localhost}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ['127.0.0.1:${WEB_PORT:-8080}:8080']
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']

  # Local names over plain HTTP (docker/caddy/Caddyfile). Port 80 by default; set PROXY_PORT if it is
  # taken, and put the same port in the URLs in .env.
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:${PROXY_PORT:-80}:80']
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      <<: *healthcheck
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']

volumes:
  postgres-data:
  chroma-data:
  langflow-data:
  uploads:
