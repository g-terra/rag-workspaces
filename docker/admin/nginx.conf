# Serves the admin UI and forwards /api/* to the API, so the browser only ever
# talks to one origin (no CORS) and the API stays reachable for scripts on :3000.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads go through here too (M1); keep in step with the API's upload limit.
  client_max_body_size 200m;

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streamed answers and ingestion status are server-sent events: don't buffer them.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Hashed assets never change; cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths get index.html and React Router takes over (M4).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
