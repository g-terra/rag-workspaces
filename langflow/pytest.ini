[pytest]
# Tests import the components as `rag_workspaces.<module>`, the package Langflow loads from components/.
pythonpath = components tests
testpaths = tests
addopts = -q
# Langflow's own deprecation warnings (pydantic v1-style config in lfx) are not ours to fix.
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:lfx.*
