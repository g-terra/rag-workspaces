[pytest]
# Tests import the components as `rag_workspaces.<module>`, the package Langflow loads from components/, and the
# shared stand-ins as `fakes`.
pythonpath = components tests
testpaths = tests
addopts = -q
# Deprecation warnings from Langflow's and Google's own code are not ours to fix.
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:lfx.*
    ignore::DeprecationWarning:google.*
