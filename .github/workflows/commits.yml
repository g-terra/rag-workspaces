name: Commits

# Every commit in a pull request must be a Conventional Commit (`feat(api): …`), because
# release-please reads them on main to pick the next version and write the changelog.

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Conventional Commit messages
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
